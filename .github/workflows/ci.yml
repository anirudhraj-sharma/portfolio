name: CI

on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # weekly, to catch new advisories between pull requests

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Check every page carries the CSP meta
        run: |
          missing=$(grep -RL 'http-equiv="Content-Security-Policy"' out --include='*.html' || true)
          if [ -n "$missing" ]; then echo "CSP meta missing in: $missing"; exit 1; fi
