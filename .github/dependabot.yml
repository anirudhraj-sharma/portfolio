version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, and eslint fails on it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Stay on the same major as the Node version used in CI.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
